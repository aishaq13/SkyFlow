services:
  kafka:
    image: bitnami/kafka:3.8
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
    ports: ["9092:9092"]
    healthcheck: { test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"], interval: 10s, timeout: 5s, retries: 10 }
  operations-db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: operations, POSTGRES_USER: skyflow, POSTGRES_PASSWORD: skyflow }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U skyflow -d operations"], interval: 5s, timeout: 5s, retries: 10 }
  recovery-db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: recovery, POSTGRES_USER: skyflow, POSTGRES_PASSWORD: skyflow }
    ports: ["5433:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U skyflow -d recovery"], interval: 5s, timeout: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
  operations-service:
    build: { context: ./operations-service }
    environment: { DB_URL: jdbc:postgresql://operations-db:5432/operations, DB_USER: skyflow, DB_PASSWORD: skyflow, KAFKA_BOOTSTRAP_SERVERS: kafka:9092 }
    ports: ["8081:8081"]
    depends_on: { kafka: { condition: service_healthy }, operations-db: { condition: service_healthy } }
  recovery-service:
    build: { context: ./recovery-service }
    environment: { DB_URL: jdbc:postgresql://recovery-db:5432/recovery, DB_USER: skyflow, DB_PASSWORD: skyflow, KAFKA_BOOTSTRAP_SERVERS: kafka:9092, OPERATIONS_URL: http://operations-service:8081 }
    ports: ["8082:8082"]
    depends_on: { kafka: { condition: service_healthy }, recovery-db: { condition: service_healthy }, operations-service: { condition: service_started } }
  query-service:
    build: { context: ./query-service }
    environment: { REDIS_HOST: redis, KAFKA_BOOTSTRAP_SERVERS: kafka:9092 }
    ports: ["8083:8083"]
    depends_on: { kafka: { condition: service_healthy }, redis: { condition: service_healthy } }
